[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


###############################################################################
# Project Metadata
###############################################################################

[project]
name = "universal-blockchain-platform"

version = "2.0.0"

description = """
Universal Blockchain Platform (UBP)

Enterprise blockchain infrastructure platform providing:
- Wallet management
- Blockchain connectivity
- Provider abstraction
- Transaction processing
- Multi-chain services
"""

authors = [
    { name = "Jaramogi Diddy" }
]

requires-python = ">=3.12"

readme = "README.md"


###############################################################################
# Runtime Dependencies
###############################################################################

dependencies = [

    # Blockchain
    "web3>=7.0.0",
    "eth-account>=0.13.0",

    # Environment management
    "python-dotenv>=1.0.0",

    # HTTP/API
    "requests>=2.32.0",

    # Data validation
    "pydantic>=2.0.0",

    # Security
    "cryptography>=43.0.0",

]



###############################################################################
# Development Dependencies
###############################################################################

[project.optional-dependencies]

dev = [

    # Testing
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",

    # Type checking
    "mypy>=1.10.0",

    # Formatting
    "black>=24.0.0",

    # Linting
    "ruff>=0.6.0",

]



###############################################################################
# Package Discovery
###############################################################################

[tool.setuptools.packages.find]

where = [
    "."
]

include = [
    "wallets*",
    "providers*",
    "blockchain*",
    "core*",
    "config*",
    "database*",
]

exclude = [
    "tests*",
    "venv*",
    ".venv*",
]



###############################################################################
# Pytest Configuration
###############################################################################

[tool.pytest.ini_options]

pythonpath = [
    "."
]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

python_classes = [
    "Test*"
]

python_functions = [
    "test_*"
]

addopts = [
    "-v"
]



###############################################################################
# Coverage Configuration
###############################################################################

[tool.coverage.run]

branch = true

source = [
    "wallets",
    "providers",
    "blockchain",
    "core",
]



###############################################################################
# Ruff Configuration
###############################################################################

[tool.ruff]

line-length = 88

target-version = "py312"



###############################################################################
# Black Configuration
###############################################################################

[tool.black]

line-length = 88

target-version = [
    "py312"
]