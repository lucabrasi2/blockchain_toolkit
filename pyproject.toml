###############################################################################
#
# Universal Blockchain Platform (UBP)
#
# pyproject.toml
#
# Enterprise Build Configuration
#
# Author:
#     Jaramogi Diddy
#
# Project:
#     Universal Blockchain Platform (UBP)
#
# Version:
#     2.0 Enterprise
#
###############################################################################

###############################################################################
# Build System
###############################################################################

[build-system]

requires = [
    "setuptools>=70.0",
    "wheel>=0.45.0",
]

build-backend = "setuptools.build_meta"

###############################################################################
# Project Metadata
###############################################################################

[project]

name = "universal-blockchain-platform"

version = "2.0.0"

description = "Enterprise multi-blockchain inspection and analysis platform."

readme = "README.md"

requires-python = ">=3.11"

license = { file = "LICENSE" }

authors = [
    { name = "Jaramogi Diddy" }
]

maintainers = [
    { name = "Jaramogi Diddy" }
]

###############################################################################
# Project Keywords
###############################################################################

keywords = [

    "blockchain",

    "ethereum",

    "bitcoin",

    "tron",

    "wallet",

    "web3",

    "rpc",

    "cryptocurrency",

    "inspection",

    "analysis",

    "enterprise",

    "ubp",

]

###############################################################################
# Project Classifiers
###############################################################################

classifiers = [

    "Development Status :: 5 - Production/Stable",

    "Intended Audience :: Developers",

    "Intended Audience :: Information Technology",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.11",

    "Programming Language :: Python :: 3.12",

    "Topic :: Software Development",

    "Topic :: Security",

    "Topic :: Internet",

]

###############################################################################
# Project URLs
###############################################################################

[project.urls]

Homepage = "https://github.com/jaramogididdy/universal-blockchain-platform"

Documentation = "https://github.com/jaramogididdy/universal-blockchain-platform"

Repository = "https://github.com/jaramogididdy/universal-blockchain-platform"

Issues = "https://github.com/jaramogididdy/universal-blockchain-platform/issues"

###############################################################################
# Runtime Dependencies
###############################################################################

dependencies = [

    ###########################################################################
    # Ethereum
    ###########################################################################

    "web3>=7.0.0",

    "eth-account>=0.13.0",

    ###########################################################################
    # TRON
    ###########################################################################

    "tronpy>=0.6.0",

    ###########################################################################
    # HTTP
    ###########################################################################

    "requests>=2.32.0",

    "websockets>=12.0",

    ###########################################################################
    # Environment
    ###########################################################################

    "python-dotenv>=1.0.0",

    ###########################################################################
    # Database
    ###########################################################################

    "sqlalchemy>=2.0.23",

    "psycopg2-binary>=2.9.9",

    ###########################################################################
    # Validation
    ###########################################################################

    "pydantic>=2.5.0",

    ###########################################################################
    # Security
    ###########################################################################

    "cryptography>=43.0.0",

    ###########################################################################
    # Utilities
    ###########################################################################

    "typing-extensions>=4.8.0",

]

###############################################################################
# End Part 1
###############################################################################
###############################################################################
# Optional Dependencies
###############################################################################

[project.optional-dependencies]

###############################################################################
# Development
###############################################################################

dev = [

    ###########################################################################
    # Testing
    ###########################################################################

    "pytest>=8.3.0",

    "pytest-cov>=5.0.0",

    ###########################################################################
    # Formatting
    ###########################################################################

    "black>=24.10.0",

    "isort>=5.13.2",

    ###########################################################################
    # Linting
    ###########################################################################

    "ruff>=0.7.0",

    ###########################################################################
    # Static Type Checking
    ###########################################################################

    "mypy>=1.13.0",

    ###########################################################################
    # Security
    ###########################################################################

    "bandit>=1.7.10",

]

###############################################################################
# Setuptools
###############################################################################

[tool.setuptools]

include-package-data = true

###############################################################################
# Package Discovery
###############################################################################

[tool.setuptools.packages.find]

where = [
    "."
]

include = [

    ###########################################################################
    # Application
    ###########################################################################

    "controllers*",

    "services*",

    "providers*",

    "wallets*",

    "transactions*",

    "registry*",

    ###########################################################################
    # Blockchain Modules
    ###########################################################################

    "ethereum*",

    "bitcoin*",

    "tron*",

    ###########################################################################
    # Core
    ###########################################################################

    "core*",

    "database*",

    "config*",

    "exceptions*",

]

exclude = [

    "tests*",

    "venv*",

    ".venv*",

    "node_modules*",

    "legacy*",

]

###############################################################################
# Package Data
###############################################################################

[tool.setuptools.package-data]

"*" = [

    "*.json",

    "*.yaml",

    "*.yml",

    "*.ini",

    "*.txt",

]

###############################################################################
# Pytest
###############################################################################

[tool.pytest.ini_options]

pythonpath = [

    ".",

]

testpaths = [

    "tests",

]

python_files = [

    "test_*.py",

]

python_classes = [

    "Test*",

]

python_functions = [

    "test_*",

]

addopts = [

    "-v",

    "--strict-markers",

]

###############################################################################
# Coverage
###############################################################################

[tool.coverage.run]

branch = true

source = [

    "controllers",

    "services",

    "providers",

    "wallets",

    "transactions",

    "ethereum",

    "bitcoin",

    "tron",

    "core",

    "database",

]

###############################################################################
# Coverage Report
###############################################################################

[tool.coverage.report]

show_missing = true

skip_empty = true

precision = 2

###############################################################################
# Ruff
###############################################################################

[tool.ruff]

line-length = 88

target-version = "py311"

###############################################################################
# Black
###############################################################################

[tool.black]

line-length = 88

target-version = [

    "py311",

]

###############################################################################
# isort
###############################################################################

[tool.isort]

profile = "black"

line_length = 88

###############################################################################
# mypy
###############################################################################

[tool.mypy]

python_version = "3.11"

warn_return_any = true

warn_unused_configs = true

disallow_untyped_defs = false

ignore_missing_imports = true

###############################################################################
# End Part 2
###############################################################################
###############################################################################
# Bandit
###############################################################################

[tool.bandit]

exclude_dirs = [

    "tests",

    "venv",

    ".venv",

    "node_modules",

    "legacy",

]

skips = [

]

###############################################################################
# Wheel Build
###############################################################################

[tool.setuptools.dynamic]

###############################################################################
# Source Distribution
###############################################################################

[tool.setuptools.exclude-package-data]

"*" = [

    "*.pyc",

    "*.pyo",

    "__pycache__",

]

###############################################################################
# Build Configuration
###############################################################################

[tool.distutils.bdist_wheel]

universal = false

###############################################################################
# Project Scripts (Future)
###############################################################################

[project.scripts]

ubp = "app:main"

###############################################################################
# Future Entry Points
###############################################################################

#[project.entry-points."ubp.providers"]

#alchemy = "providers.alchemy:AlchemyProvider"

#infura = "providers.infura:InfuraProvider"

#tron = "providers.tron:TronProvider"

###############################################################################
# Packaging Notes
###############################################################################

#
# UBP follows a layered enterprise architecture.
#
# CLI/API
#     │
# Controllers
#     │
# Services
#     │
# Blockchain Modules
#     │
# Providers
#     │
# Networks
#
# Package discovery intentionally mirrors this structure.
#

###############################################################################
# Future Build Targets
###############################################################################

#
# Planned packaging support:
#
# ✓ PyPI package
# ✓ Internal enterprise repository
# ✓ Docker image
# ✓ Kubernetes deployment
# ✓ Private package index
#

###############################################################################
# End of Configuration
###############################################################################