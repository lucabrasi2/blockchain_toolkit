[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubp"
version = "0.8.0"
description = "Universal Blockchain Platform"
readme = "README.md"
requires-python = ">=3.11"

authors = [
{name = "William Seme"}
]

dependencies = [
"web3",
"python-dotenv",
"requests",
"websockets"
]

keywords = [
"blockchain",
"ethereum",
"bitcoin",
"tron",
"web3",
"cryptocurrency"
]

classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Operating System :: OS Independent"
]

[project.scripts]
ubp = "app:main"

[tool.setuptools]
include-package-data = true
