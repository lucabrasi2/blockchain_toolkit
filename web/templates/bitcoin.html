<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin - UBP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e17;
            color: #e0e6ed;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1f2e, #0d1220);
            padding: 20px 40px;
            border-bottom: 1px solid #2a3a5a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .version { color: #6a7a8e; font-size: 14px; }
        .nav {
            display: flex;
            gap: 20px;
            background: #141b2b;
            padding: 12px 40px;
            border-bottom: 1px solid #1e2a3e;
        }
        .nav a {
            color: #8a9aae;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s;
            font-size: 15px;
        }
        .nav a:hover { background: #1e2a3e; color: #e0e6ed; }
        .nav a.active { background: #f7931a; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px; }
        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
            margin-bottom: 24px;
        }
        .page-title .emoji { font-size: 36px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
        }
        .card {
            background: #141b2b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #1e2a3e;
        }
        .card h3 {
            font-size: 16px;
            color: #8a9aae;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card input {
            width: 100%;
            padding: 10px 14px;
            background: #0d1422;
            border: 1px solid #1e2a3e;
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            margin-bottom: 8px;
        }
        .card input:focus {
            outline: none;
            border-color: #f7931a;
        }
        .btn {
            background: linear-gradient(135deg, #f7931a, #e6841a);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.3s;
            width: 100%;
        }
        .btn:hover { opacity: 0.85; }
        .result {
            margin-top: 12px;
            padding: 12px;
            background: #0d1422;
            border-radius: 8px;
            border: 1px solid #1e2a3e;
            font-size: 12px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            color: #aab8c9;
        }
        .result .success { color: #00b894; }
        .result .error { color: #ef4444; }
        .footer {
            text-align: center;
            padding: 20px;
            color: #4a5a6e;
            font-size: 13px;
            border-top: 1px solid #1a1f2e;
            margin-top: 30px;
        }
        .loading { color: #6a7a8e; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌐 Universal Blockchain Platform</h1>
        <span class="version">v2.0.0</span>
    </div>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/ethereum">🟣 Ethereum</a>
        <a href="/bitcoin" class="active">🟠 Bitcoin</a>
        <a href="/tron">🔴 TRON</a>
    </div>

    <div class="container">
        <div class="page-title">
            <span class="emoji">🟠</span>
            Bitcoin
        </div>

        <div class="grid">
            <!-- Wallet -->
            <div class="card">
                <h3>👛 Wallet Inspection</h3>
                <input type="text" id="btc-wallet" value="1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa">
                <button class="btn" onclick="inspectBtcWallet()">Inspect Wallet</button>
                <div id="btc-wallet-result" class="result">Ready</div>
            </div>

            <!-- Block -->
            <div class="card">
                <h3>🔍 Block Exploration</h3>
                <input type="text" id="btc-block" value="latest">
                <button class="btn" onclick="exploreBtcBlock()">Explore Block</button>
                <div id="btc-block-result" class="result">Ready</div>
            </div>

            <!-- Transaction -->
            <div class="card">
                <h3>📊 Transaction Analysis</h3>
                <input type="text" id="btc-tx" placeholder="Enter transaction hash">
                <button class="btn" onclick="analyzeBtcTx()">Analyze Transaction</button>
                <div id="btc-tx-result" class="result">Ready</div>
            </div>

            <!-- Fee -->
            <div class="card">
                <h3>⛽ Fee Optimization</h3>
                <button class="btn" onclick="getBtcFee()">Get Fee Estimates</button>
                <div id="btc-fee-result" class="result">Ready</div>
            </div>
        </div>
    </div>

    <div class="footer">
        Universal Blockchain Platform (UBP) v2.0.0 &bull; Built with ❤️
    </div>

    <script>
        async function fetchAPI(url, data) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return response.json();
        }

        function displayResult(elementId, data) {
            const el = document.getElementById(elementId);
            if (data.error) {
                el.innerHTML = `<span class="error">❌ ${data.error}</span>`;
            } else {
                el.innerHTML = `<span class="success">✅ Success</span>\n${JSON.stringify(data, null, 2)}`;
            }
        }

        async function inspectBtcWallet() {
            const address = document.getElementById('btc-wallet').value;
            document.getElementById('btc-wallet-result').textContent = '⏳ Loading...';
            const data = await fetchAPI('/api/bitcoin/wallet', { address });
            displayResult('btc-wallet-result', data);
        }

        async function exploreBtcBlock() {
            const block = document.getElementById('btc-block').value;
            document.getElementById('btc-block-result').textContent = '⏳ Loading...';
            const data = await fetchAPI('/api/bitcoin/block', { block });
            displayResult('btc-block-result', data);
        }

        async function analyzeBtcTx() {
            const tx_hash = document.getElementById('btc-tx').value;
            if (!tx_hash) {
                document.getElementById('btc-tx-result').textContent = '❌ Please enter a transaction hash';
                return;
            }
            document.getElementById('btc-tx-result').textContent = '⏳ Loading...';
            const data = await fetchAPI('/api/bitcoin/transaction', { tx_hash });
            displayResult('btc-tx-result', data);
        }

        async function getBtcFee() {
            document.getElementById('btc-fee-result').textContent = '⏳ Loading...';
            try {
                const response = await fetch('/api/bitcoin/fee');
                const data = await response.json();
                displayResult('btc-fee-result', data);
            } catch (e) {
                document.getElementById('btc-fee-result').textContent = `❌ Error: ${e.message}`;
            }
        }
    </script>
</body>
</html>
