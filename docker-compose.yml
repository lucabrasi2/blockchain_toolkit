version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL}
      - TRON_RPC_URL=${TRON_RPC_URL}
      - BITCOIN_RPC_URL=${BITCOIN_RPC_URL}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
